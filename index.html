<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏒 Hokejová Tipovačka MS 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="navbar-content">
                <div class="logo">🏒 MS 2026</div>
                <div class="nav-menu" id="navMenu">
                    <button class="nav-btn" onclick="showSection('dashboard')">Zápasy</button>
                    <button class="nav-btn" onclick="showSection('myBets')">Moje tipy</button>
                    <button class="nav-btn" onclick="showSection('leaderboard')">Žebříček</button>
                    <button class="nav-btn" onclick="showSection('admin')">Admin</button>
                    <button class="nav-btn logout-btn" onclick="logout()">Odhlásit</button>
                </div>
            </div>
        </nav>

        <section id="authSection" class="auth-section">
            <div class="auth-box">
                <h1>🏒 Hokejová Tipovačka MS 2026</h1>
                <p>Tipuj přesné výsledky a soutěž s přáteli!</p>
                <div class="auth-toggle">
                    <button class="toggle-btn active" onclick="toggleAuth('login')">Přihlášení</button>
                    <button class="toggle-btn" onclick="toggleAuth('register')">Registrace</button>
                </div>
                <form id="loginForm" class="auth-form active" onsubmit="app.handleLogin(event)">
                    <input type="text" id="loginUsername" placeholder="Jméno" required>
                    <input type="password" id="loginPassword" placeholder="Heslo" required>
                    <button type="submit" class="btn btn-primary">Přihlásit se</button>
                </form>
                <form id="registerForm" class="auth-form" onsubmit="app.handleRegister(event)">
                    <input type="text" id="regUsername" placeholder="Jméno" required>
                    <input type="email" id="regEmail" placeholder="Email" required>
                    <input type="password" id="regPassword" placeholder="Heslo" required>
                    <input type="password" id="regPasswordConfirm" placeholder="Potvrzení hesla" required>
                    <button type="submit" class="btn btn-primary">Registrovat se</button>
                </form>
            </div>
        </section>

        <section id="appSection" class="app-section hidden">
            <div id="dashboard" class="section"><div class="section-header"><h2>Zápasy MS 2026</h2><p id="userGreeting"></p></div><div class="filter-buttons"><button class="filter-btn active" onclick="filterMatches('all')">Všechny</button><button class="filter-btn" onclick="filterMatches('upcoming')">Nadcházející</button><button class="filter-btn" onclick="filterMatches('finished')">Skončené</button></div><div id="matchesList" class="matches-list"></div></div>
            <div id="myBets" class="section hidden"><div class="section-header"><h2>Moje tipy</h2></div><div id="myBetsList" class="bets-list"></div></div>
            <div id="leaderboard" class="section hidden"><div class="section-header"><h2>Žebříček</h2></div><div id="leaderboardList" class="leaderboard-list"></div></div>
            <div id="admin" class="section hidden"><div class="section-header"><h2>⚙️ Admin Panel</h2></div><div id="adminPanel" class="admin-panel"></div></div>
        </section>
    </div>

    <div id="betModal" class="modal hidden"><div class="modal-content"><span class="close" onclick="closeBetModal()">&times;</span><h2 id="modalTitle"></h2><form id="betForm" onsubmit="app.confirmBet(event)"><input type="text" id="betScore" placeholder="Skóre (např. 2:1)" required><button type="submit" class="btn btn-primary">Potvrdit tip</button></form></div></div>
    <div id="resultModal" class="modal hidden"><div class="modal-content"><span class="close" onclick="closeResultModal()">&times;</span><h2 id="resultModalTitle"></h2><form id="resultForm" onsubmit="app.confirmResult(event)"><input type="text" id="resultScore" placeholder="Skóre (např. 3:1)" required><button type="submit" class="btn btn-primary">Potvrdit výsledek</button></form></div></div>

    <script src="app.js"></script>
</body>
</html>
